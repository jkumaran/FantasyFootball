<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cameron's Draft Bridge</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }
    .subtitle {
      font-size: 11px;
      color: #38bdf8;
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 10px;
      border-radius: 6px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      font-size: 13px;
    }
    select option {
      background: #1e293b;
      color: #fff;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      margin-top: 4px;
    }
    .btn-primary:hover {
      opacity: 0.9;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 12px;
      margin-top: 8px;
    }
    .status-online {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-offline {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .history-box {
      margin-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 10px;
    }
    .history-title {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .history-list {
      max-height: 100px;
      overflow-y: auto;
      font-size: 11px;
      color: #cbd5e1;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      border-bottom: 1px dashed rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">🏈</span>
    <div>
      <div class="title">Cameron's Draft Bridge</div>
      <div class="subtitle">Live Sync: Yahoo • ESPN • Sleeper</div>
    </div>
  </div>

  <div class="field">
    <label>Server URL</label>
    <input type="text" id="server-url" value="http://localhost:3000" />
  </div>

  <div class="field">
    <label>Passcode</label>
    <input type="password" id="pass-code" value="fantasy2025" />
  </div>

  <div class="field">
    <label>Target Draft Room</label>
    <select id="target-session">
      <option value="yahoo-1">🟣 Yahoo: League 1</option>
      <option value="espn-2">🔴 ESPN: League 2</option>
      <option value="sleeper-3">🔵 Sleeper: League 3</option>
      <option value="mock">🎲 Manual / Mock</option>
    </select>
  </div>

  <button class="btn btn-primary" id="btn-save">Save & Test Connection</button>

  <div id="status-container" style="text-align: center;">
    <span class="status-badge status-online" id="status-badge">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: currentColor;"></span>
      Ready to Sync
    </span>
  </div>

  <div class="history-box">
    <div class="history-title">Recent Synced Picks</div>
    <div class="history-list" id="history-list">
      <div style="color: #64748b; text-align: center; padding: 8px 0;">No picks recorded yet.</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
