<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantasy Football Strategy & Draft Suite</title>
  <meta name="description" content="Full-Stack Fantasy Football Suite: Pre-draft Tiers, Live Snake Draft War Room, and Weekly Start/Sit Lineup Optimizer.">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Live Deployment / Build Status Banner -->
  <div id="deploy-notification-banner" class="deploy-banner" style="display: none;"></div>

  <!-- App Header -->
  <header class="app-header">
    <div class="brand-title">
      <div class="brand-icon">🏈</div>
      <span>GRIDIRON STRATEGY SUITE</span>
      <div class="header-status-pill" id="header-deploy-status" title="Current build status">
        <span class="status-dot"></span>
        <span class="status-text">Live</span>
      </div>
    </div>

    <!-- Main Navigation Tabs -->
    <nav class="nav-tabs">
      <button class="nav-tab active" data-tab="predraft" id="tab-predraft">
        📊 Pre-Draft Hub
      </button>
      <button class="nav-tab" data-tab="livedraft" id="tab-livedraft">
        ⚡ Live Draft War Room
      </button>
      <button class="nav-tab" data-tab="weekly" id="tab-weekly">
        🏟️ Weekly Matchup
      </button>
    </nav>

    <!-- Header Controls -->
    <div class="header-controls">
      <button class="header-auth-btn locked" id="btn-open-auth" title="Authentication status (click to unlock or manage)">
        <span class="auth-icon">🔒</span>
        <span class="auth-label">Locked</span>
      </button>
      <button class="btn-secondary" id="btn-sync-news" style="padding: 0.35rem 0.75rem; font-size: 0.8rem;" title="Sync Live NFL News via SerpAPI">
        📡 Sync News
      </button>
      <button class="btn-icon" id="btn-open-settings" title="League Settings & Backup">
        ⚙️
      </button>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="main-container">
    <!-- Mandatory Auth Gate (Rendered when unauthenticated) -->
    <section id="view-auth" class="view-section"></section>

    <!-- View 1: Pre-Draft Hub -->
    <section id="view-predraft" class="view-section"></section>

    <!-- View 2: Live Draft War Room -->
    <section id="view-livedraft" class="view-section"></section>

    <!-- View 3: Weekly Matchup Command Center -->
    <section id="view-weekly" class="view-section"></section>
  </main>

  <!-- Modal Container -->
  <div id="modal-container"></div>

  <!-- Main App Script -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
